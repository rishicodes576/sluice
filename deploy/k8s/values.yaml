replicaCount: 2

image:
  repository: ghcr.io/rishicodes576/sluice
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

# Populated into a Secret and exposed as env for ${VAR} expansion in config.
secrets:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

# Inline gateway config mounted at /etc/sluice/config.yaml.
config:
  server:
    addr: ":8080"
  cache:
    enabled: true
    threshold: 0.95
  router:
    strategy: latency
  providers:
    - name: mock
      type: mock
      models: [mock-1, gpt-4o-mini]

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
