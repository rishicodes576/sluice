# golangci-lint configuration. Kept pragmatic: high-signal linters only.
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - gocritic
    - bodyclose

issues:
  exclude-rules:
    # Table-driven tests and stubs occasionally ignore returns intentionally.
    - path: _test\.go
      linters: [errcheck, bodyclose]
  max-issues-per-linter: 0
  max-same-issues: 0

linters-settings:
  revive:
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers"]
  gocritic:
    disabled-checks:
      - ifElseChain
