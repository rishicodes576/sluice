openapi: 3.0.3
info:
  title: Sluice Gateway API
  description: >
    OpenAI-compatible LLM inference gateway with semantic caching, routing,
    rate limiting and budgets. Existing OpenAI client libraries work by simply
    pointing their base URL at Sluice.
  version: 0.1.0
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/chat/completions:
    post:
      summary: Create a chat completion (streaming or non-streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: >
            A chat completion. When `stream` is true the response is an
            SSE stream of `chat.completion.chunk` objects terminated by
            `data: [DONE]`. Response headers `X-Sluice-Cache` (hit|miss) and
            `X-Sluice-Provider` describe how the request was served.
          headers:
            X-Sluice-Cache:
              schema: { type: string, enum: [hit, miss] }
            X-Sluice-Provider:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "402": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/embeddings:
    post:
      summary: Create embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbedRequest" }
      responses:
        "200":
          description: Embedding vectors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/models:
    get:
      summary: List available models
      responses:
        "200":
          description: Model list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Model" }
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": { description: OK }
  /readyz:
    get:
      summary: Readiness probe (200 only if a backend is healthy)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: No healthy backends }
  /admin/stats:
    get:
      summary: Cache and backend statistics
      responses:
        "200": { description: Stats JSON }
  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses:
        "200": { description: Metrics in text exposition format }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  message: { type: string }
                  type: { type: string }
                  code: { type: string }
  schemas:
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        temperature: { type: number }
        max_tokens: { type: integer }
        stream: { type: boolean }
        user: { type: string }
    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    ChatResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: "#/components/schemas/Message" }
              finish_reason: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
    EmbedRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    EmbedResponse:
      type: object
      properties:
        object: { type: string }
        model: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string }
              index: { type: integer }
              embedding:
                type: array
                items: { type: number }
        usage: { $ref: "#/components/schemas/Usage" }
    Model:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        owned_by: { type: string }
